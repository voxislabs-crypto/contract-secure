openapi: 3.0.3
info:
  title: ContractSecure API
  version: '1.0.0-mvp'
  description: |
    Secure digital contract platform: create contracts, invite signers, verify identity via OTP,
    capture consent + GPS, embed signatures, finalize tamper-proof PDF with SHA-256.
  contact:
    name: API Support
    email: support@contractsecure.example.com
  license:
    name: Proprietary
    url: https://contractsecure.example.com/terms

servers:
  # Use the one that matches your backend. If your routes are /api/contracts, pick the /api server.
  - url: http://localhost:3001
    description: Local development (no base path)
  - url: http://localhost:3001/api
    description: Local development (/api base path)
  - url: https://api.contractsecure.example.com
    description: Production (no base path)
  - url: https://api.contractsecure.example.com/api
    description: Production (/api base path)

tags:
  - name: Contracts
  - name: Signers
  - name: Invites
  - name: OTP
  - name: Signing
  - name: Files

paths:
  /contracts:
    get:
      tags: [Contracts]
      summary: List recent contracts
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  contracts:
                    type: array
                    items: { $ref: '#/components/schemas/ContractSummary' }
    post:
      tags: [Contracts]
      summary: Create a contract (JSON or multipart with PDF)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, example: 'Service Agreement' }
                # You may also POST a base64 PDF in JSON later if you support it.
          multipart/form-data:
            schema:
              type: object
              properties:
                title: { type: string, example: 'Service Agreement' }
                pdf: { type: string, format: binary }
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  id: { type: string, example: 'contract_1755961740364' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /contracts/{contractId}:
    get:
      tags: [Contracts]
      summary: Get contract + signers
      parameters:
        - $ref: '#/components/parameters/ContractId'
      responses:
        '200':
          description: Contract with signers
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  contract: { $ref: '#/components/schemas/Contract' }
                  signers:
                    type: array
                    items: { $ref: '#/components/schemas/Signer' }
        '404': { $ref: '#/components/responses/NotFound' }

  /contracts/{contractId}/signers:
    post:
      tags: [Signers]
      summary: Add signers to a contract
      parameters:
        - $ref: '#/components/parameters/ContractId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                signers:
                  type: array
                  items:
                    type: object
                    properties:
                      name: { type: string, example: 'Alice Alpha' }
                      email: { type: string, format: email, example: 'alice@example.com' }
                      phone: { type: string, nullable: true }
                      sequence: { type: integer, example: 1 }
      responses:
        '200':
          description: Added
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
        '400': { $ref: '#/components/responses/BadRequest' }

  /contracts/{contractId}/invite/{signerId}:
    post:
      tags: [Invites]
      summary: Create invite link (and email) for a signer
      parameters:
        - $ref: '#/components/parameters/ContractId'
        - $ref: '#/components/parameters/SignerId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: Optional override; usually taken from signer record
      responses:
        '200':
          description: Invite created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InviteResponse' }
              examples:
                ok:
                  value:
                    ok: true
                    link: 'http://localhost:5173/sign/eyJ...jwt...'
                    token: 'eyJ...jwt...'
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /sign/{token}:
    get:
      tags: [Signing]
      summary: Open invite (resolve token to contract+signer)
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Invite details
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  contract:
                    type: object
                    properties:
                      id: { type: string }
                      title: { type: string }
                      status: { $ref: '#/components/schemas/ContractStatus' }
                  signer:
                    type: object
                    properties:
                      id: { type: string }
                      name: { type: string }
                      email: { type: string, format: email, nullable: true }
                      otpVerified: { type: boolean, nullable: true }
                      signed: { type: boolean, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /otp/start:
    post:
      tags: [OTP]
      summary: Start OTP for a signer (sends email in prod, logs in dev)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpStartRequest' }
      responses:
        '200':
          description: Sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
        '400': { $ref: '#/components/responses/BadRequest' }

  /otp/verify:
    post:
      tags: [OTP]
      summary: Verify OTP (supports DEV_ACCEPT_CODE in dev)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpVerifyRequest' }
      responses:
        '200':
          description: Verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
        '400': { $ref: '#/components/responses/BadRequest' }

  /sign/{token}/sign:
    post:
      tags: [Signing]
      summary: Submit signature (requires OTP verified)
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignRequest' }
      responses:
        '200':
          description: Signed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /contracts/{contractId}/finalize:
    post:
      tags: [Contracts]
      summary: Finalize contract, embed signatures, append audit page
      parameters:
        - $ref: '#/components/parameters/ContractId'
      responses:
        '200':
          description: Finalized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinalizeResponse' }
              examples:
                ok:
                  value:
                    ok: true
                    download: '/contracts/contract_1755961740364/download'
                    downloadUrl: '/contracts/contract_1755961740364/download'
                    sha256: 'a5f2b1...deadbeef'
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }

  /contracts/{contractId}/download:
    get:
      tags: [Files]
      summary: Download finalized PDF
      parameters:
        - $ref: '#/components/parameters/ContractId'
      responses:
        '200':
          description: PDF stream
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '404': { $ref: '#/components/responses/NotFound' }

components:
  parameters:
    ContractId:
      name: contractId
      in: path
      required: true
      schema: { type: string }
      description: Contract ID (string, not necessarily UUID)
    SignerId:
      name: signerId
      in: path
      required: true
      schema: { type: string }
      description: Signer ID (string, not necessarily UUID)
    WebhookId:
      name: webhookId
      in: path
      required: true
      schema: { type: string }
      description: Webhook subscription ID

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        ok: { type: boolean, example: false }
        error: { type: string, example: 'not_found' }
        message: { type: string, example: 'Not found' }
        requestId: { type: string, example: '123e4567-e89b-12d3-a456-426614174000' }

    User:
      type: object
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: string }
        role: { type: string, enum: [user, admin], example: 'user' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ContractStatus:
      type: string
      enum: [draft, pending, partially_signed, executed, void]

    ContractSummary:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        status: { $ref: '#/components/schemas/ContractStatus' }
        created_at: { type: string, nullable: true }

    Contract:
      allOf:
        - $ref: '#/components/schemas/ContractSummary'
        - type: object
          properties:
            base_pdf_path: { type: string, nullable: true }
            final_pdf_path: { type: string, nullable: true }
            pdf_sha256: { type: string, nullable: true }

    Signer:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email, nullable: true }
        phone: { type: string, nullable: true }
        sequence: { type: integer }
        otp_verified_at: { type: string, nullable: true }
        signed_at: { type: string, nullable: true }
        signature_path: { type: string, nullable: true }
        gps_lat: { type: number, nullable: true }
        gps_lng: { type: number, nullable: true }
        gps_accuracy: { type: number, nullable: true }
        consented: { type: integer, nullable: true, description: '0/1' }
        ip_address: { type: string, nullable: true }
        ua: { type: string, nullable: true }

    InviteResponse:
      type: object
      properties:
        ok: { type: boolean, example: true }
        link: { type: string, example: 'http://localhost:5173/sign/<token>' }
        token: { type: string, example: '<jwt>' }

    OtpStartRequest:
      type: object
      required: [contractId, signerId, email]
      properties:
        contractId: { type: string }
        signerId: { type: string }
        email: { type: string, format: email }

    OtpVerifyRequest:
      type: object
      required: [contractId, signerId, code]
      properties:
        contractId: { type: string }
        signerId: { type: string }
        code: { type: string, example: '123456' }

    SignRequest:
      type: object
      required: [signatureDataUrl, consented]
      properties:
        signatureDataUrl: { type: string, description: 'data:image/png;base64,...' }
        gps:
          type: object
          nullable: true
          properties:
            lat: { type: number }
            lng: { type: number }
            accuracy: { type: number, nullable: true }
        consented: { type: boolean }
        ua: { type: string, description: 'User agent string', nullable: true }

    FinalizeResponse:
      type: object
      properties:
        ok: { type: boolean, example: true }
        download: { type: string, example: '/contracts/{id}/download' }
        downloadUrl: { type: string, example: '/contracts/{id}/download' }
        sha256: { type: string, example: 'e3b0c44298fc1c149...' }

    PaginationMeta:
      type: object
      properties:
        total: { type: integer, example: 42 }
        page: { type: integer, example: 1 }
        limit: { type: integer, example: 20 }
        totalPages: { type: integer, example: 3 }

    AuditLog:
      type: object
      properties:
        id: { type: integer, example: 123 }
        contract_id: { type: string }
        signer_id: { type: string, nullable: true }
        event: { type: string, example: 'DOCUMENT_SIGNED' }
        payload_json:
          type: object
          additionalProperties: true
          description: 'Arbitrary event payload'
        created_at: { type: string, format: date-time }

    WebhookSubscription:
      type: object
      required: [url, events]
      properties:
        id: { type: string, readOnly: true }
        url: { type: string, format: uri, example: 'https://webhook.example.com/contract-events' }
        events:
          type: array
          minItems: 1
          items:
            type: string
            enum:
              [contract.created, contract.signed, signer.invited, signer.signed, document.completed]
          example: [contract.created, contract.signed]
        secret:
          type: string
          description: 'HMAC secret for verifying webhook payloads'
          writeOnly: true
        createdAt: { type: string, format: date-time, readOnly: true }
        updatedAt: { type: string, format: date-time, readOnly: true }

  responses:
    BadRequest:
      description: Bad request
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthorized:
      description: Unauthorized
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Forbidden
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Not found
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    ServerError:
      description: Server error
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

x-future:
  webhooks:
    contract.finalized:
      post:
        summary: Webhook (future) — contract finalized
        description: Emitted when a contract transitions to executed.
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                properties:
                  contractId: { type: string }
                  sha256: { type: string }
                  finalizedAt: { type: string, format: date-time }
  endpoints:n nnnn
    - /auth/login
    - /auth/refresh
    - /webhooks
    - /webhooks/{webhookId}
    - /audit-logs
